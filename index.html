<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulador de Expressão Regular</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <nav class="top-nav" aria-label="Navegação principal">
      <a href="index.html" class="nav-link active">Expressão Regular</a>
      <a href="pages/gramatica.html" class="nav-link">Gramática Regular</a>
    </nav>

    <main class="container">
      <h1>Simulador de Expressão Regular</h1>

      <div class="field-group">
        <label for="regex">Expressão regular</label>
        <input type="text" id="regex" placeholder="Exemplo: ^(ab)$" />
        <label class="checkbox-label">
          <input type="checkbox" id="caseInsensitive" />
          Ignorar maiúsculas e minúsculas
        </label>
      </div>

      <div class="field-group">
        <label for="test1">Teste 1</label>
        <input type="text" id="test1" class="test-input" />
      </div>

      <div class="field-group">
        <label for="test2">Teste 2</label>
        <input type="text" id="test2" class="test-input" />
      </div>
    </main>

    <script src="js/expressao.js"></script>
  </body>
</html>
